<div class="w-[90%] box-border mx-auto">

  <div class="flex gap-0 mb-4 border-b border-gray-300 dark:border-gray-700">
    <button onclick="setTab('combat')" id="tab-combat" class="tab-btn px-4 py-2 border-b-2 text-sm font-medium transition-colors text-blue-600 border-blue-600 dark:text-blue-500 dark:border-blue-500">Combat</button>
    <button onclick="setTab('infected')" id="tab-infected" class="tab-btn px-4 py-2 border-b-2 text-sm font-medium transition-colors text-gray-500 border-transparent hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">Infected</button>
    <button onclick="setTab('progression')" id="tab-progression" class="tab-btn px-4 py-2 border-b-2 text-sm font-medium transition-colors text-gray-500 border-transparent hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">Progression</button>
    <button onclick="setTab('general')" id="tab-general" class="tab-btn px-4 py-2 border-b-2 text-sm font-medium transition-colors text-gray-500 border-transparent hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">General</button>
  </div>

  <div id="legend" class="flex flex-wrap gap-1.5 mb-3"></div>

  <div class="flex gap-1.5 mb-3 items-center flex-wrap">
    <span class="text-xs text-gray-500 dark:text-gray-400">Range:</span>
    <button onclick="setRange(7)" id="r7" class="range-btn px-2 py-1 text-xs rounded border transition-colors border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800">7d</button>
    <button onclick="setRange(30)" id="r30" class="range-btn px-2 py-1 text-xs rounded border transition-colors border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800">30d</button>
    <button onclick="setRange(90)" id="r90" class="range-btn px-2 py-1 text-xs rounded border transition-colors border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800">90d</button>
    <button onclick="setRange(null)" id="rAll" class="range-btn px-2 py-1 text-xs rounded border transition-colors border-blue-500 bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-white dark:border-blue-500">All</button>
    
    <button onclick="toggleMode()" id="mode-btn" class="range-btn ml-2 px-2 py-1 text-xs rounded border transition-colors border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800">Showing: Growth</button>
    
    <span class="text-[11px] text-gray-500 dark:text-gray-400 ml-auto">scroll to zoom · drag to pan · dbl-click to reset</span>
  </div>

  <div id="myplot" class="relative w-full"></div>
  
  <div id="tooltip" class="absolute hidden bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3 pointer-events-none z-10 shadow-xl max-w-sm"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const GROUPS = {
  combat:      { stats: ['Kills','Deaths','Assists','Headshots','Backstabs','NoScopes','FirstBloods','FireKills','BotKills','VehicleKills'] },
  infected:    { stats: ['InfectedKills','InfectedRoundsWon','InfectedMatchesWon'] },
  progression: { stats: ['EXP','Prestige','RifleXP','LTRifleXP','AssaultXP','SupportXP','MedicXP','SniperXP','GunnerXP','AntiTankXP','CommanderXP'] },
  general:     { stats: ['Wins','Games','TimePlayed','Karma','HighestKillStreak','HighestDeathStreak'] }
};

const DEFAULT_ACTIVE = {
  combat:      new Set(['Kills','Deaths','Assists','Headshots']),
  infected:    new Set(['InfectedKills','InfectedRoundsWon','InfectedMatchesWon']),
  progression: new Set(['EXP','AssaultXP','SupportXP','MedicXP']),
  general:     new Set(['Wins','Games','HighestKillStreak'])
};

const PALETTE = [
  '#378ADD','#1D9E75','#D85A30','#D4537E','#BA7517',
  '#639922','#7F77DD','#E24B4A','#5DCAA5','#F0997B',
  '#888780','#0F6E56'
];

const raw = {{ raw_data | safe }};

let currentTab = 'combat';
let currentRange = null;
let activeKeys = {};
Object.keys(GROUPS).forEach(tab => { activeKeys[tab] = new Set(DEFAULT_ACTIVE[tab]); });

const colorMap = {};
let ci = 0;
Object.values(GROUPS).forEach(g => {
  g.stats.forEach(k => { colorMap[k] = PALETTE[ci++ % PALETTE.length]; });
});

let showDelta = true;

if (raw && raw.length > 0) {
  const baseline = Object.assign({}, raw[0]);
  raw.forEach(d => {
    d.date = new Date(d.Date);
    Object.values(GROUPS).forEach(g => {
      g.stats.forEach(k => {
        if (d[k] !== undefined) {
          d['_total_' + k] = +d[k];
          d['_delta_' + k] = +d[k] - +(baseline[k] || 0);
        }
      });
    });
  });
}

function getVal(d, k) { return showDelta ? d['_delta_' + k] : d['_total_' + k]; }

function setTab(tab) {
  currentTab = tab;
  
  // Reset all tabs to inactive Tailwind classes
  document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('text-blue-600', 'border-blue-600', 'dark:text-blue-500', 'dark:border-blue-500');
      b.classList.add('text-gray-500', 'border-transparent', 'dark:text-gray-400');
  });
  
  // Set the clicked tab to active Tailwind classes
  const activeTab = document.getElementById('tab-' + tab);
  activeTab.classList.remove('text-gray-500', 'border-transparent', 'dark:text-gray-400');
  activeTab.classList.add('text-blue-600', 'border-blue-600', 'dark:text-blue-500', 'dark:border-blue-500');
  
  buildLegend();
  renderChart();
}

function setRange(days) {
  currentRange = days;
  
  // Reset all range buttons to inactive Tailwind classes
  document.querySelectorAll('.range-btn').forEach(b => {
      // Exclude the mode toggle button from the reset
      if(b.id !== 'mode-btn') {
          b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700', 'dark:bg-blue-500/10', 'dark:text-white');
          b.classList.add('border-gray-300', 'text-gray-600', 'dark:border-gray-700', 'dark:text-gray-400');
      }
  });
  
  // Set the clicked range button to active Tailwind classes
  const map = { 7:'r7', 30:'r30', 90:'r90', null:'rAll' };
  const activeBtn = document.getElementById(map[days]);
  activeBtn.classList.remove('border-gray-300', 'text-gray-600', 'dark:border-gray-700', 'dark:text-gray-400');
  activeBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700', 'dark:bg-blue-500/10', 'dark:text-white');
  
  renderChart();
}

function toggleMode() {
  showDelta = !showDelta;
  document.getElementById('mode-btn').textContent = showDelta ? 'Showing: Growth' : 'Showing: Total';
  renderChart();
}

function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  const stats = GROUPS[currentTab].stats.filter(k => raw.length > 0 && raw[0][k] !== undefined);
  stats.forEach(k => {
    const active = activeKeys[currentTab].has(k);
    const btn = document.createElement('button');
    
    // Use base Tailwind utility classes for the button structure
    btn.className = 'flex items-center gap-1.5 px-2 py-1 text-xs border rounded transition-colors';
    
    // We dynamically apply the unique graph colors via inline styles
    btn.style.borderColor = active ? colorMap[k] : 'var(--tw-border-opacity, #4b5563)'; 
    btn.style.background  = active ? colorMap[k] + '22' : 'transparent';
    btn.style.color       = active ? colorMap[k] : 'var(--tw-text-opacity, #9ca3af)';

    const dot = document.createElement('span');
    dot.className = 'w-[7px] h-[7px] rounded-full shrink-0';
    dot.style.background = active ? colorMap[k] : '#4b5563';
    
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(k));
    btn.onclick = () => {
      if (activeKeys[currentTab].has(k)) {
        if (activeKeys[currentTab].size > 1) activeKeys[currentTab].delete(k);
      } else {
        activeKeys[currentTab].add(k);
      }
      buildLegend();
      renderChart();
    };
    el.appendChild(btn);
  });
}

function renderChart() {
  const container = document.getElementById('myplot');
  container.innerHTML = '';

  if (!raw || raw.length === 0) {
    container.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-center p-8">No data available.</p>';
    return;
  }

  const activeArr = [...activeKeys[currentTab]].filter(k => raw[0][k] !== undefined);
  if (activeArr.length === 0) return;

  const allDates = raw.map(d => d.date);
  const minDate = d3.min(allDates), maxDate = d3.max(allDates);
  let startDate = minDate;
  if (currentRange) {
    const candidate = d3.timeDay.offset(maxDate, -currentRange);
    startDate = candidate > minDate ? candidate : minDate;
  }
  const visData = raw.filter(d => d.date >= startDate);

  const margin = { top: 16, right: 24, bottom: 36, left: 58 };
  const totalW = container.clientWidth || 900;
  const W = totalW - margin.left - margin.right;
  const H = 300 - margin.top - margin.bottom;
  
  // Note: These colors map to the D3 Canvas rendering. You can swap these out for 
  // CSS variables if you want the D3 lines to perfectly switch on dark/light mode toggle.
  const axisColor = '#4b5563', gridColor = '#374151', textColor = '#9ca3af';

  const x = d3.scaleTime().domain([startDate, maxDate]).range([0, W]);
  const yMax = d3.max(visData, d => Math.max(...activeArr.map(k => getVal(d,k) || 0)));
  const y = d3.scaleLinear().domain([0, yMax * 1.1 || 1]).nice().range([H, 0]);

  const svg = d3.select(container).append('svg')
    .attr('width', totalW)
    .attr('height', H + margin.top + margin.bottom)
    .append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

  svg.selectAll('.gl').data(y.ticks(5)).enter().append('line')
    .attr('x1', 0).attr('x2', W)
    .attr('y1', d => y(d)).attr('y2', d => y(d))
    .attr('stroke', gridColor).attr('stroke-width', 1);

  const xAxisG = svg.append('g').attr('class','x-axis').attr('transform', `translate(0,${H})`)
    .call(d3.axisBottom(x).ticks(Math.floor(W/90)).tickSize(0).tickPadding(8))
    .call(g => g.select('.domain').attr('stroke', axisColor))
    .call(g => g.selectAll('text').style('fill', textColor).style('font-size','11px'));

  svg.append('g')
    .call(d3.axisLeft(y).ticks(5).tickSize(0).tickPadding(8)
      .tickFormat(v => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : v >= 1000 ? (v/1000).toFixed(0)+'k' : v))
    .call(g => g.select('.domain').remove())
    .call(g => g.selectAll('text').style('fill', textColor).style('font-size','11px'));

  svg.append('clipPath').attr('id','clip').append('rect').attr('width', W).attr('height', H);
  const linesG = svg.append('g').attr('clip-path','url(#clip)');

  function drawLines(zx) {
    linesG.selectAll('path').remove();
    activeArr.forEach(k => {
      linesG.append('path')
        .datum(visData)
        .attr('fill','none')
        .attr('stroke', colorMap[k])
        .attr('stroke-width', 2)
        .attr('class', 'data-line')
        .attr('d', d3.line().x(d => zx(d.date)).y(d => y(getVal(d,k)||0)).curve(d3.curveMonotoneX));
    });
  }
  drawLines(x);

  const focusG = svg.append('g').style('display','none');
  focusG.append('line').attr('y1',0).attr('y2',H)
    .attr('stroke','#6b7280').attr('stroke-width',1).attr('stroke-dasharray','3,2');
  const circles = focusG.selectAll('circle').data(activeArr).enter().append('circle')
    .attr('r', 4).attr('fill', k => colorMap[k]).attr('stroke','#111').attr('stroke-width',1.5);

  const tooltip = document.getElementById('tooltip');
  const bisect = d3.bisector(d => d.date).left;
  let currX = x;

  const zoomBehavior = d3.zoom()
    .extent([[0,0],[W,H]])
    .on('zoom', event => {
      let newX = event.transform.rescaleX(x);
      let [d0, d1] = newX.domain();
      if (d0 < minDate) { const dt = minDate-d0; d0=minDate; d1=new Date(d1.getTime()+dt); }
      if (d1 > maxDate) { const dt = d1-maxDate; d1=maxDate; d0=new Date(d0.getTime()-dt); }
      currX = d3.scaleTime().domain([d0,d1]).range([0,W]);
      xAxisG.call(d3.axisBottom(currX).ticks(Math.floor(W/90)).tickSize(0).tickPadding(8))
        .call(g => g.select('.domain').attr('stroke', axisColor))
        .call(g => g.selectAll('text').style('fill', textColor).style('font-size','11px'));
      drawLines(currX);
    });

  svg.append('rect').attr('width',W).attr('height',H)
    .attr('fill','none').attr('pointer-events','all')
    .call(zoomBehavior)
    .on('dblclick.zoom', null)
    .on('dblclick', () => {
      currX = x;
      xAxisG.call(d3.axisBottom(x).ticks(Math.floor(W/90)).tickSize(0).tickPadding(8))
        .call(g => g.select('.domain').attr('stroke', axisColor))
        .call(g => g.selectAll('text').style('fill', textColor).style('font-size','11px'));
      drawLines(x);
    })
    .on('mouseover', () => { focusG.style('display',null); tooltip.style.display='block'; })
    .on('mouseout',  () => { focusG.style('display','none'); tooltip.style.display='none'; })
    .on('mousemove', function(event) {
      const [mx] = d3.pointer(event);
      const x0 = currX.invert(mx);
      const i = bisect(visData, x0);
      const d = visData[Math.max(0, i-1)];
      if (!d) return;
      focusG.attr('transform', `translate(${currX(d.date)},0)`);
      circles.attr('cy', k => y(d[k]||0));
      
      // Converted tooltip innerHTML to use Tailwind utilities
      tooltip.innerHTML =
        `<div class="text-gray-500 dark:text-gray-400 text-[10px] mb-1.5 font-medium">${d.date.toLocaleDateString()}</div>` +
        activeArr.map(k =>
          `<div class="flex justify-between items-center gap-6 mb-1 text-sm">
            <span class="font-semibold" style="color:${colorMap[k]};">● ${k}</span>
            <div class="text-right text-gray-800 dark:text-gray-200">
                ${(d['_total_'+k]||0).toLocaleString()} 
                <span class="text-gray-500 text-xs ml-1">(+${showDelta ? (d['_delta_'+k]||0).toLocaleString() : (d[k]||0).toLocaleString()})</span>
            </div>
          </div>`
        ).join('');
        
        const ttW = tooltip.offsetWidth || 180;
        const ttH = tooltip.offsetHeight || 120;
        const left = event.clientX + 16 + ttW > window.innerWidth  ? event.clientX - ttW - 8 : event.clientX + 16;
        const top  = event.clientY - 10 + ttH > window.innerHeight ? event.clientY - ttH - 8 : event.clientY - 10;
        tooltip.style.left = left + 'px';
        tooltip.style.top  = top  + 'px';
    });
}

buildLegend();
renderChart();
</script>
