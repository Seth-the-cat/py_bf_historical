<nav class="m-4 rounded-lg bg-olive-400 dark:bg-olive-800 text-white p-4 flex items-center">
        <div class="flex flex-row text-center gap-4 w-full">
            <div class="flex-auto">
                <h1 class="flex-none text-5xl text-gray-800 dark:text-gray-300 hover:underline"><a href="{{url_for('index')}}">Blockfront<br>historical</a></h1>
                <div class="flex-auto"><a href="https://github.com/seth-the-cat/py_bf_historical">Github</a></div>
            </div>
            <div class="flex-auto"><strong>{{players_online}}</strong> players online</div>
            <div id="last_update" title="Stats are fetched every 10 minutes" class="w-32"></div>
            <div class="flex-auto"><a href="{{url_for('find_player')}}">Player Stats</a></div>
            <div class="flex-auto"><a href="{{url_for('compare')}}">Compare Players</a></div>
            <button id="accent-trigger" title="Customize accent color" onclick="toggleAccentPanel()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3C7 3 3 7 3 12s4 9 9 9c.8 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c2.8 0 5-2.2 5-5 0-4.4-4-8-9-8zm-5.5 9c-.8 0-1.5-.7-1.5-1.5S5.7 9 6.5 9 8 9.7 8 10.5 7.3 12 6.5 12zm3-4C8.7 8 8 7.3 8 6.5S8.7 5 9.5 5s1.5.7 1.5 1.5S10.3 8 9.5 8zm5 0c-.8 0-1.5-.7-1.5-1.5S13.7 5 14.5 5s1.5.7 1.5 1.5S15.3 8 14.5 8zm3 4c-.8 0-1.5-.7-1.5-1.5S16.7 9 17.5 9s1.5.7 1.5 1.5-.7 1.5-1.5 1.5z"/>
                </svg>
            </button>
            <script>
                const lastUpdated = new Date("{{last_updated}}Z");

function updateLastUpdated() {
    const now = new Date();
    // This ensures diffMs is at least 0, even if the user's clock is ahead
    const diffMs = Math.max(0, now - lastUpdated); 

    const diffMins = Math.floor(diffMs / 60000);
    const diffSecs = Math.floor((diffMs % 60000) / 1000);
    let displayText = "Last updated ";
    
    // Fix 1: Use && (logical AND) instead of & (bitwise AND)
    if (diffMins >= 10 && diffMins < 11) {
        location.reload();
    } else if (diffMins > 11) { 
        displayText += `${diffMins} minutes ago. <br> 
        <span class="inline-block mt-1 px-2 py-1 text-xs font-bold text-red-700 bg-red-100 rounded-md dark:bg-red-900/40 dark:text-red-400">
            ⚠️ Stats fetching likely down.
        </span>`;
    } else if (diffMins > 0) {
        // Fix 3: Also changed to "else if"
        displayText += `${diffMins} minute${diffMins !== 1 ? 's' : ''} ago`;
    } else {
        displayText += `${diffSecs} second${diffSecs !== 1 ? 's' : ''} ago`;
    }
    
    // Fix 4: Use .innerHTML instead of .innerText so the <br> renders
    document.getElementById("last_update").innerHTML = displayText;
}

setInterval(updateLastUpdated, 1000);
updateLastUpdated();
            </script>
        </div>
    </nav>
